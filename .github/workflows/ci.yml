name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fleek/database exec prisma generate
      - run: pnpm -w lint
      - run: pnpm -w typecheck

  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://fleek:fleek_dev_password@localhost:5432/fleek_iprs
      JWT_SECRET: ci-test-secret-change-in-prod
      FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: fleek
          POSTGRES_PASSWORD: fleek_dev_password
          POSTGRES_DB: fleek_iprs
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fleek -d fleek_iprs"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w build
      - run: pnpm --filter @fleek/database exec prisma migrate deploy
      - run: pnpm --filter @fleek/database exec prisma db seed
      - run: pnpm -w test

  build-web:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fleek/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 1

  build-dashboard:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fleek/dashboard... build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: apps/dashboard/.next
          retention-days: 1