name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleek_iprs_test
  JWT_SECRET: ci-jwt-secret
  FIELD_ENCRYPTION_KEY: ci-field-key
  NEXT_PUBLIC_API_URL: http://localhost:4000/v1
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @fleek/types build
          pnpm --filter @fleek/providers build
          pnpm --filter @fleek/database generate
          pnpm --filter @fleek/database build

      - name: Validate Prisma schema
        run: pnpm --filter @fleek/database exec prisma validate

      - name: Lint
        run: pnpm -w lint

      - name: Typecheck
        run: pnpm -w typecheck

      - name: Unit tests
        run: pnpm -w test

  e2e:
    name: E2E (register → verify → result)
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleek_iprs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -w build

      - name: Migrate & seed database
        run: |
          pnpm --filter @fleek/database exec prisma migrate deploy
          pnpm --filter @fleek/database seed

      - name: Start API
        run: |
          node apps/api/dist/main.js &
          echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/v1/health && break || sleep 1
          done
          curl -sf http://localhost:4000/v1/health || (echo "API failed to start" && exit 1)

      - name: Start dashboard
        run: |
          cd apps/dashboard
          node_modules/.bin/next build
          nohup node_modules/.bin/next start -p 3001 &
          echo $! > /tmp/dashboard.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/login >/dev/null && break || sleep 1
          done
          curl -sf http://localhost:3001/login >/dev/null || (echo "Dashboard failed to start" && exit 1)

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm exec playwright test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
