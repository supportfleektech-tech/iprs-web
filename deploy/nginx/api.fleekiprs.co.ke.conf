# Fleek IPRS — REST API (api.fleekiprs.co.ke)
server {
    listen 80;
    server_name api.fleekiprs.co.ke;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name api.fleekiprs.co.ke;

    ssl_certificate     /etc/letsencrypt/live/api.fleekiprs.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fleekiprs.co.ke/privkey.pem;
    include /etc/nginx/conf.d/shared/ssl-params.inc;

    # M-Pesa callback endpoint — no auth, generous size for Daraja payloads.
    client_max_body_size 256k;

    location / {
        proxy_pass http://api:4000;
        include /etc/nginx/conf.d/shared/proxy-params.inc;
    }
}
