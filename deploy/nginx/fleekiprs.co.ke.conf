# Fleek IPRS — public site (fleekiprs.co.ke)
# HTTP → HTTPS redirect
server {
    listen 80;
    server_name fleekiprs.co.ke www.fleekiprs.co.ke;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name fleekiprs.co.ke www.fleekiprs.co.ke;

    ssl_certificate     /etc/letsencrypt/live/fleekiprs.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fleekiprs.co.ke/privkey.pem;
    include /etc/nginx/conf.d/shared/ssl-params.inc;

    location / {
        proxy_pass http://web:3000;
        include /etc/nginx/conf.d/shared/proxy-params.inc;
    }
}
