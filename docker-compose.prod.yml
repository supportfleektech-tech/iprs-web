# Production stack: Postgres + API + web + dashboard behind nginx/TLS.
# Copy deploy/.env.prod.example to .env and fill in secrets before first run.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fleek_iprs}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fleek}']
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fleek}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fleek_iprs}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set in .env}
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGINS: https://fleekiprs.co.ke,https://app.fleekiprs.co.ke
      PASSWORD_RESET_URL: https://app.fleekiprs.co.ke/reset-password
      ENABLED_CHECKS: iprs_standard,kra_pin_verification,match_id_phone,sim_swap_check
      # Live verification upstream (optional — sandbox when empty):
      USE_LIVE_UPSTREAM: ${USE_LIVE_UPSTREAM:-false}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
      LIVE_CHECKS: ${LIVE_CHECKS:-iprs_standard,kra_pin_verification}
      # M-Pesa Daraja (optional — mock gateway when empty):
      DARAJA_CONSUMER_KEY: ${DARAJA_CONSUMER_KEY:-}
      DARAJA_CONSUMER_SECRET: ${DARAJA_CONSUMER_SECRET:-}
      DARAJA_SHORTCODE: ${DARAJA_SHORTCODE:-}
      DARAJA_PASSKEY: ${DARAJA_PASSKEY:-}
      DARAJA_ENV: ${DARAJA_ENV:-sandbox}
      DARAJA_CALLBACK_URL: ${DARAJA_CALLBACK_URL:-https://api.fleekiprs.co.ke/v1/payments/callback}
      # Backup upstream (optional — explicit opt-in retry only):
      BACKUP_BASE_URL: ${BACKUP_BASE_URL:-}
      BACKUP_API_KEY: ${BACKUP_API_KEY:-}
      BACKUP_CHECKS: ${BACKUP_CHECKS:-}
      # Card via Stripe (optional — sandbox auto-complete when empty):
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # PayPal Orders v2 (optional — sandbox auto-complete when empty):
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_SECRET: ${PAYPAL_SECRET:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      PAYPAL_CURRENCY: ${PAYPAL_CURRENCY:-USD}
      # SMTP mail (optional — log-only ConsoleMailer when SMTP_HOST empty):
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Fleek IPRS <no-reply@fleekiprs.co.ke>}
      TRUST_PROXY: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/v1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.next
      args:
        APP: web
        NEXT_PUBLIC_API_URL: https://api.fleekiprs.co.ke/v1
        NEXT_PUBLIC_APP_URL: https://app.fleekiprs.co.ke
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://api.fleekiprs.co.ke/v1
      NODE_ENV: production
    depends_on:
      - api

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.next
      args:
        APP: dashboard
        NEXT_PUBLIC_API_URL: https://api.fleekiprs.co.ke/v1
        NEXT_PUBLIC_APP_URL: https://app.fleekiprs.co.ke
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://api.fleekiprs.co.ke/v1
      NODE_ENV: production
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx:/etc/nginx/conf.d:ro
      - ./deploy/nginx/shared:/etc/nginx/conf.d/shared:ro
      - ./nginx/certs:/etc/letsencrypt:ro
      - ./nginx/www:/var/www/certbot
    depends_on:
      - web
      - dashboard
      - api

  certbot:
    image: certbot/certbot
    profiles: ['tls']
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot

volumes:
  pgdata:
