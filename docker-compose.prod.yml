services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fleek_iprs}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fleek']
      interval: 5s
      retries: 10

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fleek}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fleek_iprs}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set in .env}
      PORT: 4000
      CORS_ORIGINS: https://fleekiprs.co.ke,https://app.fleekiprs.co.ke
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      args:
        APP: web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/v1
    ports:
      - '3000:3000'
    depends_on:
      - api

  dashboard:
    build:
      context: .
      args:
        APP: dashboard
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/v1
    ports:
      - '3001:3000'
    depends_on:
      - api

volumes:
  pgdata:
