# Fleek IPRS — Render Blueprint (free tier).
# In Render: New > Blueprint > select the iprs-web repo. Render creates the
# API web service + Postgres and wires DATABASE_URL automatically.
# NOTE: free Postgres expires 30 days after creation (Render deletes data
# unless upgraded). Move the DB to Neon/Supabase for anything long-lived.
services:
  - type: web
    name: fleek-iprs-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fleek-iprs-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://iprs-web-v2.vercel.app,https://iprs-dashboard.vercel.app
      - key: PASSWORD_RESET_URL
        value: https://iprs-dashboard.vercel.app/reset-password
      - key: TRUST_PROXY
        value: 'true'
      # Optional integrations — empty/sandbox until you set them in the
      # Render dashboard (sync: false keeps secrets out of the repo).
      - key: USE_LIVE_UPSTREAM
        value: 'false'
      - key: UPSTREAM_BASE_URL
        sync: false
      - key: UPSTREAM_API_KEY
        sync: false
      - key: LIVE_CHECKS
        value: iprs_standard,kra_pin_verification
      - key: BACKUP_BASE_URL
        sync: false
      - key: BACKUP_API_KEY
        sync: false
      - key: BACKUP_CHECKS
        sync: false
      - key: DARAJA_CONSUMER_KEY
        sync: false
      - key: DARAJA_CONSUMER_SECRET
        sync: false
      - key: DARAJA_SHORTCODE
        sync: false
      - key: DARAJA_PASSKEY
        sync: false
      - key: DARAJA_ENV
        value: sandbox
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: Fleek IPRS <no-reply@fleekiprs.co.ke>

databases:
  - name: fleek-iprs-db
    plan: free
